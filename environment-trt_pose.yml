name: trt_pose
channels:
  - defaults
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - numpy
  - scipy
  - scikit-image
  - opencv
  - pillow
  - cython
  - setuptools
  - pip:
    - yacs
    - easydict
    - matplotlib
    - requests

# NOTE: PyTorch (and the CUDA-enabled build) is NOT pinned here because the correct
# build depends on your local CUDA version. See README_TESTING.md for the
# recommended conda/pip install commands to add a CUDA-compatible PyTorch.
